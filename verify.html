<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="card">

<img src="assets/logo.png" class="logo" alt="Logo">

<h1>Cognifyz Technologies</h1>

<h2>Internship Completion Certificate</h2>

<div class="verified">
✅ Certificate Successfully Verified
</div>

<table>

<tr>
<td>Name</td>
<td id="name"></td>
</tr>

<tr>
<td>Intern ID</td>
<td id="id"></td>
</tr>

<tr>
<td>Course</td>
<td id="course"></td>
</tr>

<tr>
<td>Duration</td>
<td id="duration"></td>
</tr>

<tr>
<td>Status</td>
<td id="status"></td>
</tr>

<tr>
<td>Reference ID</td>
<td id="refId"></td>
</tr>

</table>

<div class="qr-section">

<h3>RCB</h3>


</div>

<a id="viewCertificateLink" class="btn" target="_blank" href="#">
    📄 View Certificate
</a>

<a id="downloadCertificateLink" class="btn" href="#" download>
    ⬇ Download Certificate
</a>

</div>

<footer>
© 2026 Cognifyz Technologies. All Rights Reserved.
</footer>

</div>

<script src="script.js"></script>

</body>
</html>
